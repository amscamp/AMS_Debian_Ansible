---
- name: install libreoffice packages
  apt:
    state: latest
    name: "{{ item }}" 
  loop:
    - libreoffice-help-en-us
    - libreoffice-impress
    - libreoffice-kf5
    - libreoffice-plasma
    - libreoffice-writer
    - libreoffice-calc
    - libreoffice-base
    - mythes-en-us
    - libreoffice-l10n-de

- name: install additional packages
  apt:
    state: latest
    name: "{{ item }}" 
  loop:
    - gimp
    - simple-scan
    - xournal
    - arandr

- name: install login pc packages
  apt:
    state: latest
    name: "{{ item }}" 
  loop:
    - nextcloud-desktop
    - dolphin-nextcloud
    - thunderbird
  when: hostvars[inventory_hostname].ansible_default_ipv4.macaddress not in no_logins_macs


- name: install packages
  apt:
    state: latest
    name: "{{ item }}" 
  loop:
    - curl
    - jq


