---

- name: install apt driver
  apt:
    state: latest
    name: "{{ item }}" 
  loop:
    - hplip
  notify: 'restart cups'

- name: Adding user {{ print_username }} to lp
  user: name={{ print_username }}
        groups=lp
        append=yes

- name: Adding user {{ print_username }} to lpadmin
  user: name={{ print_username }}
        groups=lpadmin
        append=yes

- name: Copy PPD filters in the ppd folder
  copy:
    src: "ppd/"
    dest: "/usr/share/ppd/cupsfilters/"
    owner: root
    group: root
    mode: 0644
  notify: 'restart cups'

# - name: Copy filter in the filter folder
#   copy:
#     src: "filter/"
#     dest: "/usr/lib/cups/filter/"
#     owner: root
#     group: root
#     mode: 0755

- name: Check if i386 is enabled
  shell: dpkg --print-foreign-architectures | grep i386
  register: result_i386_check
  changed_when: result_i386_check.rc == 1
  failed_when: result_i386_check.rc > 1

- name: Enable i386 architecture
  command: dpkg --add-architecture i386
  when: result_i386_check.rc == 1

- name: Ensure apt cache is up to date
  ansible.builtin.apt:
    update_cache: true
  when: result_i386_check.rc == 1

- name: Install .deb packages
  ansible.builtin.apt:
    deb: "{{ role_path }}/files/deb/{{ item }}"
  loop:
    - brother-udev-rule-type1-1.0.2-0.all.deb
    - brscan4-0.4.11-1.amd64.deb
    - mfcj5730dwlpr-1.0.1-0.i386.deb
    - mfcj5730dwcupswrapper-1.0.1-0.i386.deb
    - mfcl8690cdwlpr-1.5.0-0.i386.deb
    - mfcl8690cdwcupswrapper-1.5.0-0.i386.deb
    - libsane-dsseries_1.0.5-1_amd64.deb
    - kyodialog_9.2-0_amd64.deb
  notify: 'restart cups'

- name: install gutenprint
  apt:
    state: latest
    name: "{{ item }}" 
  loop:
    - printer-driver-gutenprint

- import_tasks: uld.yml

- name: Determine network id file presence
  ansible.builtin.stat:
    path: /run/fnd/network_id
  register: fnd_netid_stat

- name: Read network id from file
  ansible.builtin.slurp:
    path: /run/fnd/network_id
  when: fnd_netid_stat.stat.exists
  register: fnd_netid_slurp

- name: Set network id fact
  ansible.builtin.set_fact:
    fnd_network_id: "{{ (fnd_netid_slurp.content | b64decode | trim) if fnd_netid_stat.stat.exists else 'unknown' }}"


- name: Ensure CreateIPPPrinterQueues is set to All
  ansible.builtin.replace:
    path: /etc/cups/cups-browsed.conf
    regexp: '^\s*#*\s*(CreateIPPPrinterQueues All.*)'
    replace: '\1'
  when: fnd_network_id == 'ams'

- name: Ensure CreateIPPPrinterQueues is set to All
  ansible.builtin.replace:
    path: /etc/cups/cups-browsed.conf
    regexp: '^\s*#*\s*(CreateIPPPrinterQueues All.*)'
    replace: '\1'
  notify: 'restart cups-browsed'
  when: fnd_network_id != 'ams'
